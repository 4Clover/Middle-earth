# sops-nix configuration
# Age key location: /home/clovr/.config/sops/age/keys.txt
#
# Bootstrap process:
# 1. Generate age key: mkdir -p ~/.config/sops/age && age-keygen -o ~/.config/sops/age/keys.txt
# 2. Get public key: age-keygen -y ~/.config/sops/age/keys.txt
# 3. Replace <AGE_PUBLIC_KEY> below with your public key
# 4. Encrypt secrets: sops secrets/example.yaml
# 5. Run: sudo nixos-rebuild switch --flake .#legolas

creation_rules:
  - path_regex: secrets/.*\.yaml$
    age: >-
      <AGE_PUBLIC_KEY>
