# Example secrets file for sops-nix
# This file should be encrypted with: sops secrets/example.yaml
#
# After generating your age key and updating .sops.yaml with your public key,
# run: sops secrets/example.yaml
# This will open your editor to add real secrets, then encrypt the file.

opencode:
  api_key: "<YOUR_OPENCODE_API_KEY>"
  
anthropic:
  api_key: "<YOUR_ANTHROPIC_API_KEY>"

openai:
  api_key: "<YOUR_OPENAI_API_KEY>"

github:
  token: "<YOUR_GITHUB_TOKEN>"
